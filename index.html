<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BhashaBuddy – Learn Indian Languages</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4fb;--sf:#fff;--ink:#151936;--mut:#6a7090;--line:#e5e7f3;--pri:#5b3df5;--pri2:#c026d3;--acc:#ff9f1c;--ok:#16a34a;--bad:#e11d48;--sh:0 8px 28px rgba(50,50,110,.10);--ts:90%;--tl:95%;--pill:rgba(255,255,255,.75)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0f21;--sf:#151a33;--ink:#eef0ff;--mut:#9aa1c7;--line:#252b4d;--sh:0 8px 28px rgba(0,0,0,.45);--ts:32%;--tl:19%;--pill:rgba(255,255,255,.09)}}
:root[data-theme="dark"]{--bg:#0c0f21;--sf:#151a33;--ink:#eef0ff;--mut:#9aa1c7;--line:#252b4d;--sh:0 8px 28px rgba(0,0,0,.45);--ts:32%;--tl:19%;--pill:rgba(255,255,255,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Malayalam","Noto Sans Bengali","Noto Sans Gujarati",sans-serif;overflow-x:hidden}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--sf);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;align-self:start}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;padding:4px 8px 6px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2),var(--acc));display:grid;place-items:center;font-size:21px;flex:none}
.bsub{font-size:12px;color:var(--mut);padding:0 8px 16px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--mut);border:0;padding:11px 12px;border-radius:13px;margin-bottom:4px;font-weight:700;box-shadow:none}
.nav button em{font-style:normal}.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.main{padding:20px 24px;max-width:1100px;width:100%;margin:0 auto}
.mb{display:none;align-items:center;gap:10px;font-weight:800;margin-bottom:10px}
.top{display:grid;grid-template-columns:1fr 46px 1fr;gap:8px;align-items:end;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh);margin-bottom:14px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px;font-weight:600}
select,input[type=text]{width:100%;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{min-height:44px;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;touch-action:manipulation}
button.alt{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#5b3df5 0%,#c026d3 58%,#ff9f1c 125%);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:14px}
.hero h2{margin:2px 0 4px;font-size:clamp(22px,6vw,30px)}.hero p{margin:0 0 12px;opacity:.9;font-size:14px}
.hero .btn{background:#fff;color:#4c1d95}.hero .btn2{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5)}
.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh)}.st .i{font-size:20px}.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
h3{margin:6px 2px 10px;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:hsl(var(--h) var(--ts) var(--tl));border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh)}.tile .ic{font-size:30px}.tile b{display:block;margin-top:4px}.tile small{color:var(--mut)}
.pills{display:flex;gap:6px;margin-top:10px}
.pill{min-height:34px;flex:1;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:800;color:var(--ink);background:linear-gradient(to right,rgba(22,163,74,.6) var(--p),var(--pill) var(--p));border:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;color:var(--mut);padding:9px 4px;font-size:14px;border-radius:11px}.seg button.on{background:var(--sf);color:var(--pri);box-shadow:var(--sh)}
.row2{display:flex;gap:10px;align-items:flex-end}.row2 .ic{font-size:34px;line-height:1}
.big{font-size:clamp(20px,6vw,26px);font-weight:700;line-height:1.25}.sm{font-size:clamp(18px,5vw,22px)}.rom{color:var(--pri);font-style:italic}.hint{color:var(--mut);font-size:13px}
.ph{display:flex;gap:10px;align-items:center;justify-content:space-between}.ph>div{flex:1}.ph button{flex:none;padding:10px 14px}
.fc{background:var(--sf);border:2px solid var(--line);border-radius:22px;padding:24px 12px;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;box-shadow:var(--sh)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btns button{flex:1 1 120px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--sf);color:var(--ink);border:2px solid var(--line)}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.14)}.opt.wrong{border-color:var(--bad);background:rgba(225,29,72,.12)}
.micbtn{width:100%;padding:16px;font-size:17px}.micbtn.on{background:linear-gradient(135deg,#e11d48,#f97316);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.5)}70%{box-shadow:0 0 0 16px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
.live{min-height:88px;font-size:clamp(20px,5vw,26px);font-weight:700;padding:12px;border-radius:14px;background:var(--bg);margin:10px 0}.int{color:var(--mut);font-weight:500}
.match{background:var(--bg);border-radius:14px;padding:10px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px}
.glyph{font-size:76px;line-height:1.15;font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));column-gap:12px}
.lt{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.lt b{display:block;font-size:28px;line-height:1.3}.lt span{font-size:12px;color:var(--pri);font-weight:700}
.lt.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.cv{width:100%;max-width:440px;aspect-ratio:1/1;display:block;margin:0 auto;background:var(--bg);border:2px dashed var(--line);border-radius:18px;touch-action:none;cursor:crosshair}
.bottom{display:none}
/* BhashaBuddy navigation: eight clear square icon tiles */
.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.nav button{min-height:94px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;text-align:center;border:1px solid var(--line);background:var(--bg);margin:0;padding:9px 5px;border-radius:16px;white-space:normal}
.nav button span{font-size:27px;line-height:1.1}.nav button em{font-size:12px;font-style:normal}.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
@media(max-width:699px){.bottom{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:6px 5px calc(6px + env(safe-area-inset-bottom,0px));}.bottom button{min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.bottom button.on{background:var(--pri);color:#fff}.bottom button span{font-size:20px}.bottom button em{font-size:10px}}
.basics-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;align-items:stretch}
.basics-card{margin:0;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}
.basics-meaning{font-size:14px;color:var(--mut)}
.basics-language{padding:10px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.basics-language .big{overflow-wrap:anywhere;word-break:normal}
.basics-arrow{font-size:12px;font-weight:800;color:var(--pri);text-align:center}
.basics-language.target{border:1px solid var(--line)}
.basics-listen{width:100%;margin-top:auto;white-space:normal}
.basics-controls{max-width:none!important}
@media(max-width:699px){.basics-grid{grid-template-columns:minmax(0,1fr);gap:10px}.basics-card{padding:13px}.basics-language .big{font-size:clamp(21px,6vw,28px)}.basics-listen{min-height:46px}.basics-controls{padding:12px}.bottom{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){.bottom button{font-size:9px}.bottom button span{font-size:17px}.basics-card{padding:11px}.basics-language{padding:8px}}
/* phone: bottom navigation */
@media(max-width:699px){
  .shell{grid-template-columns:1fr}.side{display:none}.mb{display:flex}
  .bottom{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
  .bottom button{min-width:0;min-height:52px;background:none;color:var(--mut);border:0;padding:4px 1px;font-size:clamp(9px,2.6vw,11px);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:10px;box-shadow:none}
  .bottom button span{font-size:clamp(17px,4.8vw,20px);line-height:1}.bottom button em{font-style:normal}.bottom button.on{color:var(--pri)}
  .main{padding:12px 12px 92px}
  .stats{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr 1fr}.tile{padding:12px}.hero{padding:16px}.hero .ring{margin:0 auto}
  .top{padding:10px;gap:6px}
}
/* tablet: slim icon rail on the left */
@media(min-width:700px) and (max-width:1023px){
  .shell{grid-template-columns:84px minmax(0,1fr)}
  .side{padding:14px 6px}
  .brand{flex-direction:column;gap:4px;padding:2px 0 12px;font-size:11px;text-align:center}
  .bsub{display:none}
  .nav button{flex-direction:column;gap:2px;padding:10px 2px;font-size:11px;text-align:center;justify-content:center}
  .nav button span{font-size:22px;line-height:1}
  .main{padding:20px 28px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .lgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .fc{min-height:260px}.glyph{font-size:96px}
  #body>*:not(.cols){max-width:720px;margin-left:auto;margin-right:auto}
  .cv{max-width:520px}
}
/* large screens */
@media(min-width:1024px){
  #body>*:not(.cols){max-width:760px;margin-left:auto;margin-right:auto}
  .lgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}
/* very small phones */
@media(max-width:380px){.tiles{grid-template-columns:1fr}.stats{gap:8px}.st b{font-size:19px}.hero .ring{width:96px;height:96px}.hero .ring svg{width:96px;height:96px}}
/* phones in landscape: keep nav slim */
@media(max-height:480px) and (max-width:1023px){
  .bottom button{flex-direction:row;gap:6px;min-height:40px}.bottom button span{font-size:16px}
  .main{padding-bottom:64px}
  .fc{min-height:150px;padding:12px}.glyph{font-size:56px}
}
@media(hover:none){.tile:hover{transform:none;box-shadow:none}}

.basics-tools{display:grid;grid-template-columns:minmax(0,2fr) minmax(150px,1fr);gap:10px;margin-top:12px}
.basics-tools input{width:100%;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.basics-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.basics-actions button{flex:1 1 140px}
.fav-btn{align-self:flex-end;min-height:38px;padding:7px 11px}.fav-btn.saved{color:#be123c;border-color:#fb7185;background:rgba(251,113,133,.12)}
@media(max-width:520px){.basics-tools{grid-template-columns:1fr}.basics-actions button{flex:1 1 100%}.top{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr)}select,input[type=text]{min-width:0}}
</style>

<body>
<div class="shell">

    <nav class="nav" id="snav"></nav>
  </aside>
  <main class="main">
    <div class="mb"><div class="logo" style="width:34px;height:34px;font-size:18px">🗣️</div>BhashaBuddy <span class="hint" style="font-weight:500">· offline phrasebook</span></div>
    <div class="top">
      <div><label for="sf">I know</label><select id="sf"></select></div>

</div>

const D=[
["Hello","नमस्ते|namaste","ನಮಸ್ಕಾರ|namaskara","నమస్కారం|namaskaram","வணக்கம்|vanakkam","നമസ്കാരം|namaskaram","नमस्कार|namaskar","নমস্কার|nomoshkar","નમસ્તે|namaste"],

["Good night","शुभ रात्रि|shubh raatri","ಶುಭ ರಾತ್ರಿ|shubha raatri","శుభ రాత్రి|shubha raatri","இனிய இரவு|iniya iravu","ശുഭരാത്രി|shubharaathri","शुभ रात्री|shubh raatri","শুভ রাত্রি|shubho raatri","શુભ રાત્રિ|shubh raatri"],

p("u1","Please go by the meter. I will not pay extra.","कृपया मीटर से चलिए, मैं ज़्यादा नहीं दूँगा/दूँगी|kripya meetar se chaliye, main zyaada nahin doonga/doongi;ದಯವಿಟ್ಟು ಮೀಟರ್ ಪ್ರಕಾರ ಬನ್ನಿ, ನಾನು ಹೆಚ್ಚು ಕೊಡಲ್ಲ|dayavittu meeTar prakaara banni, naanu hechchu koDalla;దయచేసి మీటర్ ప్రకారం రండి, నేను ఎక్కువ ఇవ్వను|dayachesi meetar prakaaram randi, nenu ekkuva ivvanu;தயவுசெய்து மீட்டர் படி வாருங்கள், நான் அதிகம் தர மாட்டேன்|dayavuseydhu meettar padi vaarungal, naan adhigam thara maatten;ദയവായി മീറ്റർ പ്രകാരം വരൂ, ഞാൻ കൂടുതൽ തരില്ല|dayavaayi meettar prakaaram varoo, njaan kooduthal tharilla;कृपया मीटरप्रमाणे चला, मी जास्त देणार नाही|kripaya meetarpramaane chala, mi jaast denaar naahi;দয়া করে মিটার অনুযায়ী চলুন, আমি বেশি দেব না|doya kore mitar onujayi cholun, ami beshi debo na;મહેરબાની કરીને મીટર પ્રમાણે ચાલો, હું વધારે નહીં આપું|meharbaani karine meetar pramaane chalo, hun vadhaare nahi aapu");
p("u2","I need to go to the airport. How much will it be?","मुझे हवाई अड्डे जाना है, कितना लगेगा?|mujhe havaai adde jaana hai, kitna lagega?;ನನಗೆ ವಿಮಾನ ನಿಲ್ದಾಣಕ್ಕೆ ಹೋಗಬೇಕು, ಎಷ್ಟು ಆಗುತ್ತೆ?|nanage vimaana nildaanakke hogabeku, eshtu aagutte?;నేను ఎయిర్‌పోర్ట్‌కి వెళ్లాలి, ఎంత అవుతుంది?|nenu airport-ki vellaali, enta avutundi?;நான் விமான நிலையம் போக வேண்டும், எவ்வளவு ஆகும்?|naan vimaana nilayam poga vendum, evvalavu aagum?;എനിക്ക് വിമാനത്താവളത്തിൽ പോകണം, എത്ര ആകും?|enikku vimaanathaavalathil pokanam, ethra aakum?;मला विमानतळावर जायचं आहे, किती होईल?|mala vimaantalaavar jaayacha aahe, kiti hoil?;আমাকে বিমানবন্দরে যেতে হবে, কত লাগবে?|amake bimanbondore jete hobe, koto lagbe?;મારે એરપોર્ટ જવું છે, કેટલું થશે?|maare airport javu chhe, ketlu thashe?");
p("p1","Where is the check-in counter for this flight?","इस फ़्लाइट का चेक-इन काउंटर कहाँ है?|is flight ka chek-in kauntar kahaan hai?;ಈ ವಿಮಾನದ ಚೆಕ್-ಇನ್ ಕೌಂಟರ್ ಎಲ್ಲಿದೆ?|ee vimaanada chek-in kauntar ellide?;ఈ ఫ్లైట్ చెక్-ఇన్ కౌంటర్ ఎక్కడ ఉంది?|ee flight chek-in kauntar ekkada undi?;இந்த விமானத்தின் செக்-இன் கவுண்டர் எங்கே?|indha vimaanathin chek-in kavundar engae?;ഈ വിമാനത്തിന്റെ ചെക്ക്-ഇൻ കൗണ്ടർ എവിടെയാണ്?|ee vimaanathinte chek-in kaundar evideyaanu?;या फ्लाईटचं चेक-इन काउंटर कुठे आहे?|ya flightcha chek-in kaunter kuthe aahe?;এই ফ্লাইটের চেক-ইন কাউন্টার কোথায়?|ei flighter chek-in kaunter kothay?;આ ફ્લાઇટનું ચેક-ઇન કાઉન્ટર ક્યાં છે?|aa flightnu chek-in kaunter kyaan chhe?");
p("p2","My luggage has not come. Please help me.","मेरा सामान नहीं आया, कृपया मदद कीजिए|mera saamaan nahin aaya, kripya madad kijiye;ನನ್ನ ಲಗೇಜ್ ಬಂದಿಲ್ಲ, ದಯವಿಟ್ಟು ಸಹಾಯ ಮಾಡಿ|nanna lagej bandilla, dayavittu sahaaya maaDi;నా లగేజీ రాలేదు, దయచేసి సహాయం చేయండి|naa lagejee raaledu, dayachesi sahaayam cheyandi;என் லக்கேஜ் வரவில்லை, தயவுசெய்து உதவுங்கள்|en lakkej varavillai, dayavuseydhu udhavungal;എന്റെ ലഗേജ് വന്നില്ല, ദയവായി സഹായിക്കൂ|ente lagej vannilla, dayavaayi sahaayikkoo;माझं सामान आलं नाही, कृपया मदत करा|majha saamaan aala naahi, kripaya madat kara;আমার মালপত্র আসেনি, দয়া করে সাহায্য করুন|amar malpotro asheni, doya kore shahajyo korun;મારો સામાન આવ્યો નથી, મહેરબાની કરીને મદદ કરો|maaro saamaan aavyo nathi, meharbaani karine madad karo");
p("s1","Can you give me a discount if I buy two?","अगर मैं दो लूँ तो क्या छूट मिलेगी?|agar main do loon to kya chhoot milegi?;ನಾನು ಎರಡು ತಗೊಂಡ್ರೆ ರಿಯಾಯಿತಿ ಕೊಡ್ತೀರಾ?|naanu eradu tagondre riyaayiti koDtheera?;నేను రెండు కొంటే తగ్గింపు ఇస్తారా?|nenu rendu konte taggimpu istaaraa?;இரண்டு வாங்கினால் தள்ளுபடி தருவீர்களா?|irandu vaanginaal thallupadi tharuveergalaa?;ഞാൻ രണ്ടെണ്ണം വാങ്ങിയാൽ കിഴിവ് തരുമോ?|njaan randennam vaangiyaal kizhivu tharumo?;मी दोन घेतले तर सूट मिळेल का?|mi don ghetle tar soot milel ka?;আমি দুটো কিনলে ছাড় দেবেন কি?|ami duto kinle chhar deben ki?;હું બે લઉં તો છૂટ મળશે?|hun be laun to chhoot malshe?");
p("s2","I will pay by card. Please give me the bill.","मैं कार्ड से भुगतान करूँगा/करूँगी, कृपया बिल दीजिए|main kaard se bhugtaan karoonga/karoongi, kripya bil dijiye;ನಾನು ಕಾರ್ಡ್‌ನಲ್ಲಿ ಪಾವತಿಸ್ತೀನಿ, ದಯವಿಟ್ಟು ಬಿಲ್ ಕೊಡಿ|naanu kaarDnalli paavatistini, dayavittu bil koDi;నేను కార్డుతో చెల్లిస్తాను, దయచేసి బిల్లు ఇవ్వండి|nenu kaardutho chellistaanu, dayachesi billu ivvandi;நான் கார்டில் செலுத்துகிறேன், தயவுசெய்து பில் கொடுங்கள்|naan kaardil seluthugiren, dayavuseydhu bil kodungal;ഞാൻ കാർഡ് വഴി പണമടയ്ക്കാം, ദയവായി ബിൽ തരൂ|njaan kaard vazhi panamadaykkaam, dayavaayi bil tharoo;मी कार्डने पैसे देईन, कृपया बिल द्या|mi kaardne paise deen, kripaya bil dya;আমি কার্ডে টাকা দেব, দয়া করে বিল দিন|ami karde taka debo, doya kore bil din;હું કાર્ડથી ચૂકવીશ, મહેરબાની કરીને બિલ આપો|hun kaardthi chukavish, meharbaani karine bil aapo");
p("r1","A table for four, please.","चार लोगों के लिए मेज़ चाहिए|chaar logon ke liye mez chahiye;ನಾಲ್ಕು ಜನರಿಗೆ ಟೇಬಲ್ ಬೇಕು|naalku janarige Tebal beku;నలుగురికి టేబుల్ కావాలి|naaluguriki tebul kaavali;நான்கு பேருக்கு மேசை வேண்டும்|naangu perukku mesai vendum;നാലുപേർക്ക് ഒരു മേശ വേണം|naalu perkku oru mesha venam;चार जणांसाठी टेबल पाहिजे|chaar janaansaathi tebal pahije;চারজনের জন্য একটা টেবিল চাই|charjoner jonyo ekta tebil chai;ચાર લોકો માટે ટેબલ જોઈએ છે|chaar loko maate tebal joie chhe");
p("r2","Please make it less spicy.","कृपया कम तीखा बनाइए|kripya kam teekha banaiye;ದಯವಿಟ್ಟು ಖಾರ ಕಡಿಮೆ ಮಾಡಿ|dayavittu khaara kaDime maaDi;దయచేసి కారం తక్కువగా చేయండి|dayachesi kaaram takkuvagaa cheyandi;தயவுசெய்து காரம் குறைவாகச் செய்யுங்கள்|dayavuseydhu kaaram kuraivaagach cheyyungal;ദയവായി എരിവ് കുറച്ച് ഉണ്ടാക്കൂ|dayavaayi erivu kurachu undaakkoo;कृपया कमी तिखट करा|kripaya kami tikhat kara;দয়া করে ঝাল কম দিন|doya kore jhal kom din;મહેરબાની કરીને ઓછું તીખું બનાવો|meharbaani karine ochhu teekhu banaavo");
p("h1","I have a booking in my name.","मेरे नाम से बुकिंग है|mere naam se buking hai;ನನ್ನ ಹೆಸರಿನಲ್ಲಿ ಬುಕಿಂಗ್ ಇದೆ|nanna hesarinalli buking ide;నా పేరు మీద బుకింగ్ ఉంది|naa peru meeda buking undi;என் பெயரில் முன்பதிவு உள்ளது|en peyaril munpadhivu ullathu;എന്റെ പേരിൽ ബുക്കിംഗ് ഉണ്ട്|ente peril bukking undu;माझ्या नावावर बुकिंग आहे|majhya naavaavar buking aahe;আমার নামে বুকিং আছে|amar name buking achhe;મારા નામે બુકિંગ છે|maara naame buking chhe");
p("h2","What time is check-out?","चेक-आउट का समय क्या है?|chek-aut ka samay kya hai?;ಚೆಕ್-ಔಟ್ ಸಮಯ ಎಷ್ಟು?|chek-aut samaya eshtu?;చెక్-అవుట్ సమయం ఎంత?|chek-avut samayam enta?;செக்-அவுட் நேரம் என்ன?|chek-avut neram enna?;ചെക്ക്-ഔട്ട് സമയം എപ്പോഴാണ്?|chek-aut samayam eppozhaanu?;चेक-आउटची वेळ काय आहे?|chek-autchi vel kaay aahe?;চেক-আউটের সময় কখন?|chek-auter shomoy kokhon?;ચેક-આઉટનો સમય શું છે?|chek-autno samay shu chhe?");
p("d1","I have had fever and pain since yesterday.","मुझे कल से बुखार और दर्द है|mujhe kal se bukhaar aur dard hai;ನನಗೆ ನಿನ್ನೆಯಿಂದ ಜ್ವರ ಮತ್ತು ನೋವು ಇದೆ|nanage ninneyinda jvara mattu novu ide;నాకు నిన్నటి నుండి జ్వరం మరియు నొప్పి ఉంది|naaku ninnati nundi jvaram mariyu noppi undi;எனக்கு நேற்றிலிருந்து காய்ச்சலும் வலியும் இருக்கிறது|enakku netrilirundhu kaaychalum valiyum irukkiradhu;എനിക്ക് ഇന്നലെ മുതൽ പനിയും വേദനയും ഉണ്ട്|enikku innale muthal paniyum vedanayum undu;मला कालपासून ताप आणि दुखणं आहे|mala kaalpaasun taap ani dukhan aahe;আমার কাল থেকে জ্বর আর ব্যথা আছে|amar kal theke jor ar byatha achhe;મને કાલથી તાવ અને દુખાવો છે|mane kaalthi taav ane dukhaavo chhe");
p("d2","Should I take this medicine after food?","क्या मुझे यह दवा खाने के बाद लेनी है?|kya mujhe yah dawa khaane ke baad leni hai?;ಈ ಔಷಧಿ ಊಟದ ನಂತರ ತಗೊಳ್ಬೇಕಾ?|ee aushadhi ootada nantara tagolbekaa?;ఈ మందు భోజనం తర్వాత వేసుకోవాలా?|ee mandu bhojanam tarvaata vesukovaalaa?;இந்த மருந்தை சாப்பிட்ட பிறகு சாப்பிட வேண்டுமா?|indha marundhai saappitta piragu saappida vendumaa?;ഈ മരുന്ന് ഭക്ഷണത്തിന് ശേഷം കഴിക്കണോ?|ee marunnu bhakshanathinu shesham kazhikkano?;हे औषध जेवणानंतर घ्यायचं का?|he aushadh jevananantar ghyaycha ka?;এই ওষুধ কি খাবারের পরে খেতে হবে?|ei oshudh ki khabarer pore khete hobe?;આ દવા જમ્યા પછી લેવાની છે?|aa dawa jamya pachhi levaani chhe?");

p("k2","My card is not working at the ATM.","मेरा कार्ड एटीएम में काम नहीं कर रहा|mera kaard etiem mein kaam nahin kar raha;ನನ್ನ ಕಾರ್ಡ್ ಎಟಿಎಂನಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತಿಲ್ಲ|nanna kaarD etiemnalli kelasa maaDtilla;నా కార్డు ఏటీఎంలో పని చేయడం లేదు|naa kaardu etiemlo pani cheyadam ledu;என் கார்டு ஏடிஎம்மில் வேலை செய்யவில்லை|en kaardu etiemmil velai seyyavillai;എന്റെ കാർഡ് എടിഎമ്മിൽ പ്രവർത്തിക്കുന്നില്ല|ente kaard etiemmil pravarthikkunnilla;माझं कार्ड एटीएममध्ये चालत नाही|majha kaard etiemmadhye chaalat naahi;আমার কার্ড এটিএমে কাজ করছে না|amar kard etiem-e kaj korchhe na;મારું કાર્ડ એટીએમમાં ચાલતું નથી|maaru kaard etiemmaan chaalatu nathi");

let remoteTTS=null,remoteTTSTimer=null;
function playRemoteIndianTTS(text, langCode, fallback){
  // Google Translate's browser TTS is used for Malayalam/Marathi/Bengali when
  // iOS does not provide a matching installed system voice. This needs internet.
  try {
    if(!remoteTTS){remoteTTS=new Audio();remoteTTS.preload='none';}
    if(remoteTTSTimer){clearTimeout(remoteTTSTimer);remoteTTSTimer=null;}
    remoteTTS.pause();remoteTTS.removeAttribute('src');remoteTTS.load();
    const q=String(text||'').trim();
    if(!q){tip('No text to pronounce.');return;}
    const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+encodeURIComponent(langCode)+'&q='+encodeURIComponent(q);
    let settled=false;
    const clean=()=>{remoteTTS.onplaying=null;remoteTTS.onerror=null;};
    remoteTTS.onplaying=()=>{settled=true;clean();tip('');};
    remoteTTS.onerror=()=>{if(settled)return;clean();fallback();};
    remoteTTS.src=url;
    const p=remoteTTS.play();
    if(p&&typeof p.catch==='function')p.catch(()=>{if(!settled){clean();fallback();}});
    // Some iOS builds reject the remote audio URL before firing an error event.
    remoteTTSTimer=setTimeout(()=>{if(!settled&&remoteTTS.paused){clean();fallback();}},5000);
  } catch(e) { fallback(); }
}
function sayText(t,l){

  const speakWithSystemVoice=()=>{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
      tip('This iPhone browser cannot play speech here. Check the internet connection and tap Listen again.');return;
    }
    try{
      gv();const u=new SpeechSynthesisUtterance(text);u.lang=langCode;u.rate=.78;u.pitch=1;
      const normalized=langCode.toLowerCase().replace('_','-');
      const score=v=>((v.lang||'').toLowerCase().replace('_','-')===normalized?10:((v.lang||'').toLowerCase().startsWith(base)?5:0))+( /siri|enhanced|premium|natural/i.test(v.name||'')?1:0);
      const v=VO.filter(v=>v.lang&&(v.lang.toLowerCase().replace('_','-')===normalized||v.lang.toLowerCase().startsWith(base))).sort((a,b)=>score(b)-score(a))[0];
      if(v)u.voice=v;
      u.onerror=()=>tip('No working '+langCode+' voice is available on this iPhone. Keep internet on and try Listen again.');
      u.onstart=()=>tip('');

    }catch(e){tip('Audio could not start. Check the iPhone sound settings.');}

  // Use online speech audio first so the selected language is spoken correctly.

}

    mr.start();$('res').textContent='🔴 Recording for 6 seconds… speak now';setTimeout(()=>{if(mr.state!=='inactive')mr.stop()},6000);
  }catch(e){$('res').textContent=badOrigin()?ORIGIN_MSG:'Microphone blocked or not available — allow it in browser settings.'}
}
/* ---------- quiz & listening ---------- */
let Q=null;
function startQ(mode){
  const pl=pool();
  const qs=shuf(items.map((_,i)=>i)).slice(0,S.qn||99).map(i=>{const it=items[i],ds=uniqT(shuf(pl.filter(x=>x.t.s!==it.t.s&&x.f.s!==it.f.s))).slice(0,3);return{i,it,opts:shuf([it,...ds]),done:false}});
  Q={qs,n:0,score:0,mode};qview();
}
function qview(){
  if(Q.n>=Q.qs.length){$('lessonBody').innerHTML=`<div class="card" style="text-align:center"><h3>${Q.score} / ${Q.qs.length}</h3><p>${Q.score===Q.qs.length?'Perfect! 🌟':Q.score>=Q.qs.length*.6?'Good job! 👍':'Keep practising 💪'}</p><div class="btns"><button data-a="retry">Try again</button><button class="alt" data-go="learn">Review</button></div></div>`;return}
  const q=Q.qs[Q.n],L=Q.mode==='listen';
  const pr=L?`<div class="btns" style="justify-content:center"><button data-a="replay">🔊 Play again</button><button class="alt" data-a="reveal">👁 Show text</button></div><div id="rv" style="text-align:center;margin:8px 0"></div><div class="hint" style="text-align:center">Listen. What does it mean in ${nm(S.from)}?</div>`:`<div class="big sm" style="text-align:center;margin:12px 0">${esc(q.it.f.s)}</div><div class="hint" style="text-align:center">How do you say this in ${nm(S.to)}?</div>`;
  $('lessonBody').innerHTML=`<div class="hint">Question ${Q.n+1} / ${Q.qs.length} · Score ${Q.score}</div>`+pr+q.opts.map((o,k)=>L?`<button class="opt" data-a="opt" data-k="${k}"><span class="big sm">${esc(o.f.s)}</span></button>`:`<button class="opt" data-a="opt" data-k="${k}"><span class="big sm">${esc(o.t.s)}</span> <span class="hint">${esc(o.t.r)}</span></button>`).join('')+'<div id="nx"></div>';
  if(L)sayText(q.it.t.s,S.to);
}
/* ---------- LETTERS: read & write ---------- */
let AS={sub:'v',sel:0,con:0,wi:0,guide:true,q:null};
const scr=()=>SCR[S.to];
const lets=k=>AL[scr()][k].split(';').map(x=>{const p=x.split('|');return{ch:p[0],r:p[1]}});
const allL=()=>lets('v').concat(lets('c'));
const ASUB=[['v','Vowels'],['c','Consonants'],['m','Combine'],['w','Write'],['q','Quiz']];
function alphaView(){
  $('view').innerHTML=`<div class="card"><div class="row2"><div class="ic">✍️</div><div style="flex:1"><b>${nm(S.to)} letters — read &amp; write</b><div class="hint">Follows the “I want to learn” language above. Tap a letter to hear it.</div></div></div><div class="seg" style="margin-top:10px">${ASUB.map(x=>`<button data-a="asub" data-t="${x[0]}" class="${AS.sub===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div><div id="abody"></div>`;
  alphaBody();
}
function alphaBody(){
  if(AS.sub==='v'||AS.sub==='c')aGrid(AS.sub);else if(AS.sub==='m')aCombine();else if(AS.sub==='w')aWrite();else aStartQ();
}
function aGrid(k){
  const L=lets(k);if(AS.sel>=L.length)AS.sel=0;const c=L[AS.sel];
  $('abody').innerHTML=`<div class="card" style="text-align:center"><div class="glyph">${esc(c.ch)}</div><div class="rom big">${esc(c.r)}</div><div class="btns"><button data-a="aspeak" data-s="${esc(c.ch)}">🔊 Hear</button><button class="alt" data-a="awrite" data-k="${k}" data-i="${AS.sel}">✍️ Write it</button></div></div>
  <div class="lgrid">${L.map((x,i)=>`<div class="lt ${i===AS.sel?'on':''}" data-a="apick" data-i="${i}"><b>${esc(x.ch)}</b><span>${esc(x.r)}</span></div>`).join('')}</div>
  <div class="hint" style="margin-top:10px">${L.length} ${k==='v'?'vowels':'consonants'} · ${esc(NOTE[scr()])}</div>`;
}
function aCombine(){
  if(scr()==='lat'){$('abody').innerHTML='<div class="card">English letters are joined by spelling (c-a-t). Joining with vowel signs is for Indian scripts — pick an Indian language in “I want to learn”.</div>';return}
  const C=lets('c');if(AS.con>=C.length)AS.con=0;const c=C[AS.con],stem=c.r.endsWith('a')?c.r.slice(0,-1):c.r,mt=MT[scr()],ml=ML[scr()];
  const syl=[{s:c.ch,r:c.r}];mt.forEach((m,j)=>{if(m)syl.push({s:c.ch+m,r:stem+ml[j]})});
  $('abody').innerHTML=`<div class="card"><label>Pick a consonant</label><select id="csel">${C.map((x,i)=>`<option value="${i}" ${i===AS.con?'selected':''}>${esc(x.ch)}  ${esc(x.r)}</option>`).join('')}</select><div class="hint" style="margin-top:8px">Every consonant joins with vowel signs (matras) to make syllables. This is how all words are built. Tap a syllable to hear it.</div></div>
  <div class="lgrid">${syl.map(x=>`<div class="lt" data-a="aspeak" data-s="${esc(x.s)}"><b>${esc(x.s)}</b><span>${esc(x.r)}</span></div>`).join('')}</div>`;
}
function aWrite(){
  const A=allL();if(AS.wi>=A.length)AS.wi=0;const c=A[AS.wi];
  $('abody').innerHTML=`<div class="card"><label>Letter to write</label><select id="wsel">${A.map((x,i)=>`<option value="${i}" ${i===AS.wi?'selected':''}>${esc(x.ch)}  ${esc(x.r)}</option>`).join('')}</select>
  <div class="hint" style="margin:8px 0">Trace the faint letter with your finger or mouse. Say it aloud as you write: <b>${esc(c.r)}</b></div>
  <canvas id="cv" class="cv"></canvas>
  <div class="btns"><button class="alt" data-a="wnav" data-d="-1">◀ Prev</button><button class="alt" data-a="wclear">🧽 Clear</button><button class="alt" data-a="wguide">${AS.guide?'Hide':'Show'} guide</button><button class="alt" aria-label="Play audio" data-a="aspeak" data-s="${esc(c.ch)}">🔊</button><button data-a="wnav" data-d="1">Next ▶</button></div></div>`;
  wInit();
}
function wInit(){
  const c=$('cv');if(!c||!c.getContext)return;
  const A=allL(),ch=A[AS.wi]?A[AS.wi].ch:'',dpr=window.devicePixelRatio||1,w=c.clientWidth||300;
  c.width=w*dpr;c.height=w*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink')||'#000',pri=cs.getPropertyValue('--pri')||'#5b3df5';
  if(AS.guide){x.globalAlpha=.14;x.fillStyle=ink;x.textAlign='center';x.textBaseline='middle';x.font='700 '+Math.round(w*(ch.length>2?.4:.62))+'px system-ui,"Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Malayalam","Noto Sans Bengali","Noto Sans Gujarati",sans-serif';x.fillText(ch,w/2,w/2*1.05);x.globalAlpha=1}
  x.strokeStyle=pri;x.lineWidth=Math.max(8,w/26);x.lineCap='round';x.lineJoin='round';
  let d=false,lx=0,ly=0;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{d=true;[lx,ly]=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke();e.preventDefault()};
  c.onpointermove=e=>{if(!d)return;const[px,py]=pt(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;e.preventDefault()};
  c.onpointerup=c.onpointercancel=()=>{d=false};
}
function aStartQ(){
  const A=allL();
  const qs=shuf(A).slice(0,10).map(c=>{const dir=Math.random()<.5,ds=shuf(A.filter(x=>x.ch!==c.ch&&x.r!==c.r)).slice(0,3);return{c,dir,opts:shuf([c,...ds]),done:false}});
  AS.q={qs,n:0,score:0};aQ();
}
function aQ(){
  const Z=AS.q;
  if(Z.n>=Z.qs.length){$('abody').innerHTML=`<div class="card" style="text-align:center"><h3>${Z.score} / ${Z.qs.length}</h3><p>${Z.score>=Z.qs.length-1?'Excellent! 🌟':Z.score>=Z.qs.length*.6?'Good job! 👍':'Keep practising 💪'}</p><div class="btns"><button data-a="aretry">Try again</button><button class="alt" data-a="asub" data-t="w">✍️ Practise writing</button></div></div>`;return}
  const q=Z.qs[Z.n];
  $('abody').innerHTML=`<div class="hint">Question ${Z.n+1} / ${Z.qs.length} · Score ${Z.score}</div><div class="glyph" style="text-align:center;margin:8px 0">${esc(q.dir?q.c.ch:q.c.r)}</div><div class="hint" style="text-align:center">${q.dir?'What sound does this letter make?':'Which letter makes this sound?'}</div>`
   +q.opts.map((o,k)=>`<button class="opt" data-a="aopt" data-k="${k}"><span class="big sm">${esc(q.dir?o.r:o.ch)}</span></button>`).join('')+'<div id="anx"></div>';
}

/* ---------- events ---------- */
$('sf').onchange=e=>{S.from=+e.target.value;save();render()};
$('st').onchange=e=>{S.to=+e.target.value;save();render()};
$('sw').onclick=()=>{[S.from,S.to]=[S.to,S.from];save();render()};
document.addEventListener('change',e=>{const t=e.target;if(!t)return;if(t.id==='ls'){S.sit=+t.value;save();render()}else if(t.id==='basicCat'){basicCat=t.value;basicsView()}else if(t.id==='favFilter'){showFavOnly=t.value==='fav';basicsView()}else if(t.id==='wsel'){AS.wi=+t.value;aWrite()}else if(t.id==='csel'){AS.con=+t.value;aCombine()}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='basicSearch'){const pos=e.target.selectionStart;basicSearch=e.target.value;basicsView();const n=$('basicSearch');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='importFile'&&e.target.files&&e.target.files[0])importProgressFile(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='typedAnswer'){e.preventDefault();typedCheck()}});
function exportProgress(){const payload={app:'BhashaBuddy',version:3,exportedAt:new Date().toISOString(),state:S};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bhashabuddy-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);const m=$('backupStatus');if(m)m.textContent='Progress export created.'}
function importProgressFile(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const incoming=data.state||data;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('Invalid backup');const merged={...S,...incoming};merged.from=Number.isInteger(merged.from)&&merged.from>=0&&merged.from<LG.length?merged.from:0;merged.to=Number.isInteger(merged.to)&&merged.to>=0&&merged.to<LG.length?merged.to:2;merged.favs=Array.isArray(merged.favs)?merged.favs.filter(x=>typeof x==='string'&&BASIC.some(b=>b.en===x)):[];merged.learned=Array.isArray(merged.learned)?merged.learned.filter(x=>typeof x==='string'&&BASIC.some(b=>b.en===x)):[];S=merged;save();render();const m=$('backupStatus');if(m)m.textContent='Progress restored successfully.'}catch(_){const m=$('backupStatus');if(m)m.textContent='Could not import this file. Please choose a BhashaBuddy JSON backup.'}};reader.readAsText(file)}
document.addEventListener('click',e=>{
  const T=e.target;
  const nv=T.closest('[data-nav]');if(nv){go(nv.dataset.nav);return}
  const gt=T.closest('[data-go]');if(gt){go(gt.dataset.go);return}
  const pl=T.closest('.pill');if(pl){S.sit=+pl.dataset.sit;S.lv=+pl.dataset.lv;S.view='learn';save();render();return}
  const tl=T.closest('.tile');if(tl){S.sit=+tl.dataset.sit;S.view='learn';save();render();return}
  const qn=T.closest('[data-qn]');if(qn){S.qn=+qn.dataset.qn;save();render();return}
  const lv=T.closest('[data-lv]');if(lv){S.lv=+lv.dataset.lv;save();render();return}
  const b=T.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='say')sayText(items[+b.dataset.i].t.s,S.to);
  else if(a==='flip'){P.rev=true;pview();sayText(items[P.o[P.n]].t.s,S.to)}
  else if(a==='yes'||a==='no'){mark(P.o[P.n],a==='yes',5);P.n++;P.rev=false;pview()}
  else if(a==='again')startP();
  else if(a==='speak')speak();
  else if(a==='dictate')useDictation();
  else if(a==='rec')rec();
  else if(a==='typed')typedCheck();
  else if(a==='basicsay'){const r=BASIC[+b.dataset.i];if(S.to===0)sayText(r.en,0);else sayText((r.langs[S.to-1]||{s:r.en}).s,S.to);}
  else if(a==='dailylesson'){const daySeed=Math.floor(Date.now()/86400000);const daily=BASIC.filter(x=>x.cat!=='Numbers'||['one','two','three','four','five'].includes(x.en));const start=daySeed%daily.length;const chosen=Array.from({length:5},(_,i)=>daily[(start+i)%daily.length]);basicSearch='';basicCat='All';showFavOnly=false;basicsView();const cards=$('view').querySelector('.basics-controls');if(cards){const box=document.createElement('div');box.className='card';box.innerHTML='<h3>📚 Today’s mini-lesson</h3><p class="hint">Practise these five words today. Use Listen, then mark each word learned.</p>'+chosen.map(x=>'<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.en)+'</b> — '+esc(S.to===0?x.en:(x.langs[S.to-1]||{s:x.en}).s)+'</div>').join('');cards.after(box);box.scrollIntoView({behavior:'smooth',block:'start'});}return;}
  else if(a==='learned'){const r=BASIC[+b.dataset.i];if(!r)return;S.learned=S.learned||[];if(S.learned.includes(r.en))S.learned=S.learned.filter(x=>x!==r.en);else S.learned.push(r.en);save();basicsView()}
  else if(a==='fav'){const r=BASIC[+b.dataset.i];if(!r)return;S.favs=S.favs||[];if(S.favs.includes(r.en))S.favs=S.favs.filter(x=>x!==r.en);else S.favs.push(r.en);save();basicsView()}
  else if(a==='export')exportProgress();
  else if(a==='importpick'){$('importFile').click()}
  else if(a==='resetprogress'){if(confirm('Reset saved learning progress, streaks, and favourites on this device? This cannot be undone unless you exported a backup.')){S={qn:20,from:0,to:2,sit:1,lv:0,view:'home',xp:0,streak:0,last:'',box:{},ok:0,tot:0,favs:[],learned:[]};save();render()}}
  else if(a==='retry')startQ(Q.mode);
  else if(a==='replay')sayText(Q.qs[Q.n].it.t.s,S.to);
  else if(a==='reveal'){const t=Q.qs[Q.n].it.t;$('rv').innerHTML=`<div class="big sm">${esc(t.s)}</div><div class="rom">${esc(t.r)}</div>`}
  else if(a==='opt'){
    const q=Q.qs[Q.n];if(!q||q.done)return;q.done=true;const ok=q.opts[+b.dataset.k]===q.it;
    document.querySelectorAll('.opt').forEach((x,k)=>{if(q.opts[k]===q.it)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)Q.score++;S.tot++;if(ok)S.ok++;mark(q.i,ok,10);
    if(Q.mode==='quiz')sayText(q.it.t.s,S.to);
    $('nx').innerHTML=`<div class="card" style="margin-top:8px"><b>${ok?'✓ Correct!':'✗ Not quite'}</b> — <span class="rom">${esc(q.it.t.s)} (${esc(q.it.t.r)})</span> = ${esc(q.it.f.s)}</div><button data-a="next" style="width:100%">Next →</button>`;
  }
  else if(a==='next'){Q.n++;qview()}
  else if(a==='asub'){AS.sub=b.dataset.t;alphaView()}
  else if(a==='apick'){if(AS.sub!=='v'&&AS.sub!=='c')return;AS.sel=+b.dataset.i;aGrid(AS.sub);sayText(lets(AS.sub)[AS.sel].ch,S.to)}
  else if(a==='aspeak')sayText(b.dataset.s,S.to);
  else if(a==='awrite'){AS.wi=(b.dataset.k==='c'?lets('v').length:0)+(+b.dataset.i);AS.sub='w';alphaView()}
  else if(a==='wnav'){const n=allL().length;AS.wi=(AS.wi+(+b.dataset.d)+n)%n;aWrite()}
  else if(a==='wclear')wInit();
  else if(a==='wguide'){AS.guide=!AS.guide;aWrite()}
  else if(a==='aretry')aStartQ();
  else if(a==='aopt'){
    const Z=AS.q,q=Z&&Z.qs[Z.n];if(!q||q.done)return;q.done=true;const ok=q.opts[+b.dataset.k]===q.c;
    document.querySelectorAll('.opt').forEach((x,k)=>{if(q.opts[k]===q.c)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok){Z.score++;S.xp+=5}touch();save();sayText(q.c.ch,S.to);
    $('anx').innerHTML=`<div class="card" style="margin-top:8px"><b>${ok?'✓ Correct!':'✗ Not quite'}</b> — <span class="big sm">${esc(q.c.ch)}</span> <span class="rom">${esc(q.c.r)}</span></div><button data-a="anext" style="width:100%">Next →</button>`;
  }
  else if(a==='anext'){AS.q.n++;aQ()}
});
render();
